<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9dcc4">
<title>Du Feu à la Fusée</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap">
<style>
/* Univers unique, volontairement clair : la vallée en plein jour (pas de thème sombre).
   Cartes crème posées sur le décor, encre brun chaud, accent orange du feu de camp. */
:root {
  --fond: #e9dcc4;
  --carte: #fff8ea;
  --carte-2: #f6ead2;
  --encre: #5b3c24;
  --encre-douce: #8a6a4f;
  --orange: #e9873b;
  --orange-fonce: #c96a22;
  --vert: #6fae4f;
  --vert-fonce: #4f8c35;
  --ombre: 0 6px 0 rgba(91, 60, 36, .18), 0 10px 24px rgba(91, 60, 36, .18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html { color-scheme: light; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); color: var(--encre);
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---- compteurs ---- */
#haut { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
.compteur { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: var(--carte);
  border-radius: 999px; padding: 4px 12px 4px 5px; box-shadow: var(--ombre); font-size: 18px; font-weight: 700; min-width: 68px; font-variant-numeric: tabular-nums; }
.compteur .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--carte-2); font-size: 16px; }
.compteur.tilt { animation: tilt .4s ease; }
@keyframes tilt { 0%,100% { transform: scale(1); } 40% { transform: scale(1.15); } }
#epoque-nom { margin: 0 auto; background: var(--carte); border-radius: 999px; padding: 6px 16px; box-shadow: var(--ombre);
  font-size: 16px; font-weight: 600; color: var(--encre-douce); pointer-events: none; }
.bouton-rond { pointer-events: auto; border: 0; background: var(--carte); border-radius: 50%; width: 46px; height: 46px;
  box-shadow: var(--ombre); font-size: 22px; display: grid; place-items: center; position: relative; cursor: pointer; font-family: inherit; color: var(--encre); }
.bouton-rond:active { transform: translateY(3px); }
#btn-decouvertes { width: 58px; height: 58px; font-size: 30px; }
#btn-decouvertes.pret { background: #fff1b8; animation: battre 1.2s ease-in-out infinite; }
@keyframes battre { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.pastille { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--orange);
  color: #fff; font-size: 14px; font-weight: 700; display: none; place-items: center; padding: 0 6px; }
#btn-decouvertes.pret .pastille { display: grid; }
#btn-menu, #btn-plein { width: 40px; height: 40px; font-size: 19px; }
#btn-plein { font-size: 22px; font-weight: 700; }

/* ---- tourner le téléphone ---- */
#tourner { position: fixed; inset: 0; z-index: 80; background: var(--fond); display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
#tourner .tel { font-size: 64px; animation: pivote 2s ease-in-out infinite; }
@keyframes pivote { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
#tourner p { font-size: 22px; font-weight: 600; margin: 0; max-width: 300px; }
@media (orientation: portrait) and (max-width: 900px) { #tourner { display: flex; } }
@media (prefers-reduced-motion: reduce) { #btn-reveil, #tourner .tel, #btn-decouvertes.pret, .dec.possible, #scene-images img { animation: none; } }

/* ---- barre de construction ---- */
#barre { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
#barre::-webkit-scrollbar { display: none; }
.carte-bat { flex: 0 0 auto; width: 76px; background: var(--carte); border-radius: 16px; box-shadow: var(--ombre);
  padding: 5px 4px 4px; text-align: center; position: relative; cursor: pointer; transition: transform .15s; border: 3px solid transparent; }
.carte-bat img { width: 60px; height: 46px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
.carte-bat .prix { font-size: 15px; font-weight: 700; margin-top: 2px; }
.carte-bat .nombre { position: absolute; right: -6px; bottom: 22px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 6px;
  background: var(--encre); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--carte); }
.carte-bat.non { filter: grayscale(.7); opacity: .6; }
.carte-bat.choisie { border-color: var(--orange); transform: translateY(-6px); }
.carte-bat .neuf { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--vert); color: #fff;
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.carte-bat:active { transform: translateY(2px); }

/* ---- messages ---- */
#bulle-aide { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--carte); border-radius: 18px;
  padding: 8px 18px; box-shadow: var(--ombre); font-size: 16px; pointer-events: none; font-weight: 600; display: none; max-width: 80vw; text-align: center; }
#placement { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--encre); color: #fff;
  border-radius: 999px; padding: 6px 8px 6px 18px; font-size: 16px; white-space: nowrap; font-weight: 600; display: none; align-items: center; gap: 14px; box-shadow: var(--ombre); }
#placement button { border: 0; background: #fff; color: var(--encre); width: 34px; height: 34px; border-radius: 50%; font-size: 17px; font-weight: 700; font-family: inherit; }

[hidden] { display: none !important; }
/* ---- fiche d'explication (ADR-015) ---- */
#info { position: fixed; z-index: 20; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100vw - 28px)); background: var(--carte); border-radius: 20px; box-shadow: var(--ombre);
  display: flex; gap: 10px; padding: 10px; align-items: flex-start; animation: monte .25s ease; }
#info img { width: 70px; height: 62px; object-fit: contain; flex: 0 0 auto; }
#info .info-corps { flex: 1; min-width: 0; }
#info-titre { font-size: 17px; font-weight: 700; }
#info-texte { font-size: 15px; line-height: 1.35; margin-top: 2px; }
#info-statut { font-size: 14px; font-weight: 600; color: var(--orange-fonce); margin-top: 5px; }
#info .info-boutons { display: flex; flex-direction: column; gap: 6px; }
#info.large { width: min(560px, calc(100vw - 28px)); }
#info-vignettes { display: flex; gap: 8px; margin-top: 8px; }
#info-vignettes figure { margin: 0; flex: 1 1 0; min-width: 0; cursor: pointer; }
#info-vignettes img { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block; }
#info-vignettes figcaption { font-size: 13px; line-height: 1.25; margin-top: 4px; color: var(--encre-douce); }
#info-vignettes.une figure { display: flex; gap: 10px; align-items: center; }
#info-vignettes.une img { width: 132px; flex: 0 0 auto; }
#info-vignettes.une figcaption { font-size: 14px; margin: 0; }
@media (max-height: 480px) {
  #info-vignettes img { max-width: 96px; }
  #info-vignettes.une img { width: 96px; }
  #info-texte { font-size: 14px; }
}
/* ---- le coq du réveil (ADR-016) ---- */
#btn-reveil { position: fixed; z-index: 21; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 26px; background: #fff1b8; box-shadow: var(--ombre); padding: 8px 18px 8px 8px; display: flex; align-items: center; gap: 6px;
  font-family: inherit; font-size: 20px; font-weight: 700; color: var(--encre); cursor: pointer; animation: battre 1.4s ease-in-out infinite; }
#btn-reveil img { width: 62px; height: 62px; object-fit: contain; }
#btn-reveil:active { transform: translateY(3px); }
#info .bouton-rond { width: 34px; height: 34px; font-size: 16px; box-shadow: none; background: var(--carte-2); }

/* ---- fenêtres ---- */
.voile { position: fixed; inset: 0; background: rgba(60, 40, 20, .45); display: none; align-items: center; justify-content: center; padding: 24px; }
.voile.ouvert { display: flex; animation: apparait .25s ease; }
@keyframes apparait { from { opacity: 0; } to { opacity: 1; } }
.fenetre { background: var(--carte); border-radius: 26px; box-shadow: var(--ombre); padding: 18px 22px; max-width: 860px; width: 100%;
  max-height: 92vh; overflow: auto; position: relative; animation: monte .3s cubic-bezier(.2,1.4,.5,1); }
@keyframes monte { from { transform: translateY(40px) scale(.95); } to { transform: none; } }
.fenetre h2 { margin: 0 0 4px; font-size: 26px; text-align: center; text-wrap: balance; }
.fenetre .sous { text-align: center; color: var(--encre-douce); font-size: 15px; margin-bottom: 12px; }
.fermer { position: absolute; top: 14px; right: 14px; }
.gros-bouton { border: 0; background: var(--orange); color: #fff; font-family: inherit; font-size: 21px; font-weight: 700;
  padding: 10px 30px; border-radius: 999px; box-shadow: 0 6px 0 var(--orange-fonce); cursor: pointer; display: block; margin: 18px auto 0; }
.gros-bouton:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-fonce); }

#grille-dec { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.dec { background: var(--carte-2); border-radius: 18px; padding: 8px; text-align: center; position: relative; border: 4px solid transparent; }
.dec img { width: 76px; height: 60px; object-fit: contain; }
.dec .nom { font-size: 15px; font-weight: 700; line-height: 1.1; min-height: 34px; display: flex; align-items: center; justify-content: center; }
.dec .cout { font-size: 15px; font-weight: 700; margin-top: 4px; }
.dec .besoin { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
.dec .besoin img { width: 26px; height: 22px; background: #fff; border-radius: 8px; padding: 2px; }
.dec.possible { border-color: var(--orange); background: #fff1d6; cursor: pointer; animation: battre 1.4s ease-in-out infinite; }
.dec.faite { background: #e6f2dc; }
.dec.faite::after { content: '✓'; position: absolute; top: 6px; right: 12px; font-size: 30px; color: var(--vert-fonce); font-weight: 700; }
.dec.bloquee img:first-child, .dec.attente img:first-child { filter: grayscale(.5); opacity: .75; }
.dec.bloquee::after { content: '🔒'; position: absolute; top: 6px; right: 10px; font-size: 24px; }

#scene .fenetre { max-width: 620px; text-align: center; }
#scene-images { display: flex; justify-content: center; gap: 16px; margin: 6px 0 10px; }
#scene-images img { height: min(130px, 22vh); max-width: 46%; object-fit: contain; animation: sautille 1.6s ease-in-out infinite; }
@keyframes sautille { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#scene-texte { font-size: 19px; line-height: 1.4; margin: 0 6px; }
#scene-texte b { color: var(--orange-fonce); }
.ligne-boutons { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
.ligne-boutons .gros-bouton { margin: 0; }

/* ---- la grande page (ADR-018) ---- */
#page { z-index: 30; padding: 14px; }
#page .fenetre { max-width: 1060px; padding: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); overflow: hidden; height: min(640px, 92vh); }
#page-image { position: relative; background: #e9dcc6; min-height: 0; }
#page-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
#page-bandeau { position: absolute; left: 14px; top: 14px; background: var(--orange); color: #fff; font-weight: 700; font-size: 16px;
  border-radius: 999px; padding: 6px 16px; box-shadow: var(--ombre); animation: battre 1.4s ease-in-out infinite; }
#page-corps { overflow-y: auto; padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
#page-epoque { font-size: 14px; font-weight: 600; color: var(--encre-douce); text-transform: uppercase; letter-spacing: .04em; }
#page-titre { font-size: 28px; font-weight: 700; margin: -4px 0 0; line-height: 1.1; padding-right: 44px; text-align: left; }
#page-texte { font-size: 18px; line-height: 1.4; margin: 0; }
#page h3 { font-size: 16px; margin: 6px 0 0; color: var(--orange-fonce); }
#page-faits { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
#page-faits li { background: var(--carte-2); border-radius: 14px; padding: 8px 12px 8px 40px; font-size: 15.5px; line-height: 1.35; position: relative; cursor: pointer; }
#page-faits li::before { content: '💡'; position: absolute; left: 11px; top: 7px; font-size: 18px; }
#page-bats { display: flex; flex-direction: column; gap: 8px; }
.page-bat { display: flex; gap: 10px; align-items: center; background: var(--carte-2); border-radius: 16px; padding: 8px; }
.page-bat.ici { outline: 3px solid var(--orange); }
.page-bat .imgs { display: flex; gap: 6px; flex: 0 0 auto; }
.page-bat .imgs img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; cursor: pointer; background: #fff; }
.page-bat .imgs img.sprite { object-fit: contain; padding: 4px; }
.page-bat b { display: block; font-size: 15.5px; }
.page-bat span { font-size: 14px; line-height: 1.3; color: var(--encre-douce); }
#page .fermer { z-index: 2; }
#page .ligne-boutons { justify-content: flex-start; margin-top: 4px; }
#page .gros-bouton { font-size: 19px; padding: 8px 26px; }
@media (max-height: 520px) {
  #page { padding: 8px; }
  #page .fenetre { height: 96vh; max-height: 96vh; border-radius: 20px; }
  #page-corps { padding: 12px 14px; gap: 7px; }
  #page-titre { font-size: 22px; }
  #page-texte { font-size: 15.5px; }
  #page-faits li { font-size: 14px; padding: 6px 10px 6px 34px; }
  #page-faits li::before { left: 8px; top: 5px; font-size: 15px; }
  .page-bat .imgs img { width: 64px; height: 64px; }
  .page-bat span { font-size: 13px; }
}
@media (max-width: 640px) { #page .fenetre { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; } }
#info-plus { border: 0; background: var(--orange); color: #fff; font-family: inherit; font-weight: 700; font-size: 15px; border-radius: 999px;
  padding: 6px 14px; margin-top: 7px; cursor: pointer; box-shadow: 0 3px 0 var(--orange-fonce); }
.info-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#info-ameliorer { border: 0; background: var(--vert, #5a9a3c); color: #fff; font-family: inherit; font-weight: 700; font-size: 15px; border-radius: 999px;
  padding: 6px 14px; margin-top: 7px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
#info-ameliorer.non { filter: grayscale(.8); opacity: .65; }
#info-plus:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--orange-fonce); }
.dec.faite { cursor: pointer; }
#scene-illu { width: 100%; max-height: 42vh; object-fit: cover; border-radius: 18px; margin: 4px 0 8px; display: block; }

#vole { position: fixed; pointer-events: none; font-size: 22px; font-weight: 700; z-index: 50; transition: transform .7s cubic-bezier(.5,-0.3,.7,1), opacity .7s; }
#menu .fenetre { max-width: 400px; text-align: center; }
.petit-bouton { border: 0; background: var(--carte-2); color: var(--encre); font-family: inherit; font-size: 17px; font-weight: 600;
  padding: 10px 20px; border-radius: 999px; margin: 8px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="ecran"></canvas>

<div id="haut">
  <div class="compteur" id="c-hab"><span class="ico">👥</span><span id="v-hab">0</span></div>
  <div class="compteur" id="c-pieces"><span class="ico">🪙</span><span id="v-pieces">0</span></div>
  <div class="compteur" id="c-idees"><span class="ico">💡</span><span id="v-idees">0</span></div>
  <div id="epoque-nom">L'âge de pierre</div>
  <button class="bouton-rond" id="btn-plein" aria-label="Plein écran">⛶</button>
  <button class="bouton-rond" id="btn-menu" aria-label="Menu">⚙️</button>
  <button class="bouton-rond" id="btn-decouvertes" aria-label="Découvertes">💡<span class="pastille">!</span></button>
</div>

<div id="barre"></div>
<div id="bulle-aide"></div>
<div id="info" hidden>
  <img id="info-img" alt="">
  <div class="info-corps">
    <div id="info-titre"></div>
    <div id="info-texte"></div>
    <div id="info-statut"></div>
    <div class="info-actions"><button id="info-plus" hidden>📖 En savoir plus</button><button id="info-ameliorer" hidden></button></div>
  </div>
  <div class="info-boutons">
    <button class="bouton-rond" id="info-fermer" aria-label="Fermer">✕</button>
    <button class="bouton-rond" id="info-voix" aria-label="Écouter">🔊</button>
  </div>
</div>
<button id="btn-reveil" hidden aria-label="Réveil"><img id="reveil-img" alt="">Réveil !</button>
<div id="placement"><span id="placement-texte"></span><button id="placement-annuler" aria-label="Annuler">✕</button></div>

<div class="voile" id="decouvertes"><div class="fenetre">
  <button class="bouton-rond fermer" data-ferme="decouvertes" aria-label="Fermer">✕</button>
  <h2>Les découvertes</h2>
  <div class="sous" id="dec-sous"></div>
  <div id="grille-dec"></div>
</div></div>

<div class="voile" id="scene"><div class="fenetre">
  <h2 id="scene-titre"></h2>
  <img id="scene-illu" alt="" hidden>
  <div id="scene-images"></div>
  <p id="scene-texte"></p>
  <div class="ligne-boutons">
    <button class="bouton-rond" id="scene-voix" aria-label="Écouter">🔊</button>
    <button class="gros-bouton" id="scene-ok">Super !</button>
  </div>
</div></div>

<div class="voile" id="page"><div class="fenetre">
  <div id="page-image"><img id="page-img" alt=""><div id="page-bandeau" hidden>Nouvelle découverte !</div></div>
  <div id="page-corps">
    <button class="bouton-rond fermer" id="page-fermer" aria-label="Fermer">✕</button>
    <div id="page-epoque"></div>
    <h2 id="page-titre"></h2>
    <p id="page-texte"></p>
    <h3>Le savais-tu ?</h3>
    <ul id="page-faits"></ul>
    <h3 id="page-bats-titre">Ce que ça permet de construire</h3>
    <div id="page-bats"></div>
    <div class="ligne-boutons">
      <button class="bouton-rond" id="page-voix" aria-label="Écouter">🔊</button>
      <button class="gros-bouton" id="page-ok">Super !</button>
    </div>
  </div>
</div></div>

<div class="voile" id="menu"><div class="fenetre">
  <button class="bouton-rond fermer" data-ferme="menu" aria-label="Fermer">✕</button>
  <h2>Pause</h2>
  <button class="petit-bouton" id="menu-voix">🔊 Voix : oui</button><br>
  <button class="petit-bouton" id="menu-plein">⛶ Plein écran</button><br>
  <button class="petit-bouton" id="menu-installer" hidden>📲 Installer l'appli</button>
  <p id="menu-ios" hidden style="font-size:15px;color:var(--encre-douce);margin:6px 0">Sur iPhone et iPad : bouton Partager, puis « Sur l'écran d'accueil ».</p>
  <button class="petit-bouton" id="menu-recommencer">↺ Recommencer la partie</button>
</div></div>

<div id="tourner">
  <div class="tel">📱</div>
  <p>Tourne ton téléphone pour jouer !</p>
  <button class="gros-bouton" id="tourner-plein">⛶ Plein écran</button>
</div>

<script>
/*ASSETS*/
/*SCRIPTS*/
</script>
</body>
</html>
