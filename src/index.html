<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9dcc4">
<title>Du Feu à la Fusée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Univers unique, volontairement clair : la vallée en plein jour (pas de thème sombre).
   Cartes crème posées sur le décor, encre brun chaud, accent orange du feu de camp. */
:root {
  --fond: #e9dcc4;
  --carte: #fff8ea;
  --carte-2: #f6ead2;
  --encre: #5b3c24;
  --encre-douce: #8a6a4f;
  --orange: #e9873b;
  --orange-fonce: #c96a22;
  --vert: #6fae4f;
  --vert-fonce: #4f8c35;
  --ombre: 0 6px 0 rgba(91, 60, 36, .18), 0 10px 24px rgba(91, 60, 36, .18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html { color-scheme: light; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); color: var(--encre);
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---- compteurs ---- */
#haut { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
.compteur { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--carte);
  border-radius: 999px; padding: 6px 16px 6px 8px; box-shadow: var(--ombre); font-size: 26px; font-weight: 700; min-width: 96px; }
.compteur .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--carte-2); font-size: 24px; }
.compteur.tilt { animation: tilt .4s ease; }
@keyframes tilt { 0%,100% { transform: scale(1); } 40% { transform: scale(1.15); } }
#epoque-nom { margin: 0 auto; background: var(--carte); border-radius: 999px; padding: 8px 22px; box-shadow: var(--ombre);
  font-size: 22px; font-weight: 600; color: var(--encre-douce); pointer-events: none; }
.bouton-rond { pointer-events: auto; border: 0; background: var(--carte); border-radius: 50%; width: 64px; height: 64px;
  box-shadow: var(--ombre); font-size: 32px; display: grid; place-items: center; position: relative; cursor: pointer; font-family: inherit; color: var(--encre); }
.bouton-rond:active { transform: translateY(3px); }
#btn-decouvertes { width: 84px; height: 84px; font-size: 42px; }
#btn-decouvertes.pret { background: #fff1b8; animation: battre 1.2s ease-in-out infinite; }
@keyframes battre { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.pastille { position: absolute; top: -4px; right: -4px; min-width: 28px; height: 28px; border-radius: 14px; background: var(--orange);
  color: #fff; font-size: 18px; font-weight: 700; display: none; place-items: center; padding: 0 6px; }
#btn-decouvertes.pret .pastille { display: grid; }
#btn-menu { width: 52px; height: 52px; font-size: 26px; }

/* ---- barre de construction ---- */
#barre { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
#barre::-webkit-scrollbar { display: none; }
.carte-bat { flex: 0 0 auto; width: 118px; background: var(--carte); border-radius: 22px; box-shadow: var(--ombre);
  padding: 8px 6px 6px; text-align: center; position: relative; cursor: pointer; transition: transform .15s; border: 3px solid transparent; }
.carte-bat img { width: 92px; height: 72px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
.carte-bat .prix { font-size: 20px; font-weight: 700; margin-top: 2px; }
.carte-bat.non { filter: grayscale(.7); opacity: .6; }
.carte-bat.choisie { border-color: var(--orange); transform: translateY(-8px); }
.carte-bat .neuf { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--vert); color: #fff;
  font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.carte-bat:active { transform: translateY(2px); }

/* ---- messages ---- */
#bulle-aide { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); background: var(--carte); border-radius: 24px;
  padding: 12px 24px; box-shadow: var(--ombre); font-size: 22px; font-weight: 600; display: none; max-width: 80vw; text-align: center; }
#placement { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--encre); color: #fff;
  border-radius: 999px; padding: 10px 12px 10px 24px; font-size: 22px; font-weight: 600; display: none; align-items: center; gap: 14px; box-shadow: var(--ombre); }
#placement button { border: 0; background: #fff; color: var(--encre); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; font-weight: 700; font-family: inherit; }

/* ---- fenêtres ---- */
.voile { position: fixed; inset: 0; background: rgba(60, 40, 20, .45); display: none; align-items: center; justify-content: center; padding: 24px; }
.voile.ouvert { display: flex; animation: apparait .25s ease; }
@keyframes apparait { from { opacity: 0; } to { opacity: 1; } }
.fenetre { background: var(--carte); border-radius: 32px; box-shadow: var(--ombre); padding: 26px 28px; max-width: 980px; width: 100%;
  max-height: 92vh; overflow: auto; position: relative; animation: monte .3s cubic-bezier(.2,1.4,.5,1); }
@keyframes monte { from { transform: translateY(40px) scale(.95); } to { transform: none; } }
.fenetre h2 { margin: 0 0 6px; font-size: 34px; text-align: center; }
.fenetre .sous { text-align: center; color: var(--encre-douce); font-size: 20px; margin-bottom: 18px; }
.fermer { position: absolute; top: 14px; right: 14px; }
.gros-bouton { border: 0; background: var(--orange); color: #fff; font-family: inherit; font-size: 28px; font-weight: 700;
  padding: 14px 40px; border-radius: 999px; box-shadow: 0 6px 0 var(--orange-fonce); cursor: pointer; display: block; margin: 18px auto 0; }
.gros-bouton:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-fonce); }

#grille-dec { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.dec { background: var(--carte-2); border-radius: 24px; padding: 12px; text-align: center; position: relative; border: 4px solid transparent; }
.dec img { width: 110px; height: 90px; object-fit: contain; }
.dec .nom { font-size: 21px; font-weight: 700; line-height: 1.1; min-height: 46px; display: flex; align-items: center; justify-content: center; }
.dec .cout { font-size: 20px; font-weight: 700; margin-top: 4px; }
.dec .besoin { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
.dec .besoin img { width: 34px; height: 30px; background: #fff; border-radius: 8px; padding: 2px; }
.dec.possible { border-color: var(--orange); background: #fff1d6; cursor: pointer; animation: battre 1.4s ease-in-out infinite; }
.dec.faite { background: #e6f2dc; }
.dec.faite::after { content: '✓'; position: absolute; top: 6px; right: 12px; font-size: 30px; color: var(--vert-fonce); font-weight: 700; }
.dec.bloquee img:first-child, .dec.attente img:first-child { filter: grayscale(.5); opacity: .75; }
.dec.bloquee::after { content: '🔒'; position: absolute; top: 6px; right: 10px; font-size: 24px; }

#scene .fenetre { max-width: 760px; text-align: center; }
#scene-images { display: flex; justify-content: center; gap: 16px; margin: 6px 0 10px; }
#scene-images img { height: 170px; max-width: 46%; object-fit: contain; animation: sautille 1.6s ease-in-out infinite; }
@keyframes sautille { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#scene-texte { font-size: 26px; line-height: 1.35; margin: 0 6px; }
#scene-texte b { color: var(--orange-fonce); }
.ligne-boutons { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 18px; }
.ligne-boutons .gros-bouton { margin: 0; }

#vole { position: fixed; pointer-events: none; font-size: 34px; z-index: 50; transition: transform .7s cubic-bezier(.5,-0.3,.7,1), opacity .7s; }
#menu .fenetre { max-width: 460px; text-align: center; }
.petit-bouton { border: 0; background: var(--carte-2); color: var(--encre); font-family: inherit; font-size: 22px; font-weight: 600;
  padding: 12px 26px; border-radius: 999px; margin: 8px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="ecran"></canvas>

<div id="haut">
  <div class="compteur" id="c-hab"><span class="ico">👥</span><span id="v-hab">0</span></div>
  <div class="compteur" id="c-pieces"><span class="ico">🪙</span><span id="v-pieces">0</span></div>
  <div class="compteur" id="c-idees"><span class="ico">💡</span><span id="v-idees">0</span></div>
  <div id="epoque-nom">L'âge de pierre</div>
  <button class="bouton-rond" id="btn-menu" aria-label="Menu">⚙️</button>
  <button class="bouton-rond" id="btn-decouvertes" aria-label="Découvertes">💡<span class="pastille">!</span></button>
</div>

<div id="barre"></div>
<div id="bulle-aide"></div>
<div id="placement"><span id="placement-texte"></span><button id="placement-annuler" aria-label="Annuler">✕</button></div>

<div class="voile" id="decouvertes"><div class="fenetre">
  <button class="bouton-rond fermer" data-ferme="decouvertes" aria-label="Fermer">✕</button>
  <h2>Les découvertes</h2>
  <div class="sous" id="dec-sous"></div>
  <div id="grille-dec"></div>
</div></div>

<div class="voile" id="scene"><div class="fenetre">
  <h2 id="scene-titre"></h2>
  <div id="scene-images"></div>
  <p id="scene-texte"></p>
  <div class="ligne-boutons">
    <button class="bouton-rond" id="scene-voix" aria-label="Écouter">🔊</button>
    <button class="gros-bouton" id="scene-ok">Super !</button>
  </div>
</div></div>

<div class="voile" id="menu"><div class="fenetre">
  <button class="bouton-rond fermer" data-ferme="menu" aria-label="Fermer">✕</button>
  <h2>Pause</h2>
  <button class="petit-bouton" id="menu-voix">🔊 Voix : oui</button><br>
  <button class="petit-bouton" id="menu-plein">⛶ Plein écran</button><br>
  <button class="petit-bouton" id="menu-recommencer">↺ Recommencer la partie</button>
</div></div>

<script>
/*ASSETS*/
/*SCRIPTS*/
</script>
</body>
</html>
